# FishBot 评测集：聊天 / 任务 / 记忆 / 主动能力 / 多模态
# 跑法：python tests/eval/run.py [--only chat] [--json-out data/eval/report.json]
# 断言字段：must_contain / must_not_contain / regex / max_chars / max_first_s / max_total_s
# 注意：任务用例只做只读或纯计算，避免评测改动仓库。

chat:
  - id: chat-greet
    input: "/chat 在吗"
    expect:
      max_chars: 160
      max_first_s: 10
      max_total_s: 40
  - id: chat-thanks
    input: "/chat 谢谢你"
    expect:
      max_chars: 160
      max_total_s: 40
  - id: chat-tired
    input: "/chat 今天有点累"
    expect:
      max_chars: 180
      must_not_contain: ["首先", "其次", "最后，"]
      max_total_s: 40
  - id: chat-opinion
    input: "/chat 猫和狗哪个更适合新手养"
    expect:
      max_chars: 220
      max_total_s: 45
  - id: chat-identity
    input: "/chat 你是谁"
    expect:
      regex: "女仆|呆毛|鲸"
      max_chars: 160
      max_total_s: 40
  - id: chat-one-sentence
    input: "/chat 用一句话安慰我"
    expect:
      max_chars: 100
      must_not_contain: ["- ", "1. ", "首先"]
      max_total_s: 40
  - id: chat-time
    input: "/chat 现在几点"
    expect:
      regex: "点|[:：]"
      max_total_s: 40
  - id: chat-joke
    input: "/chat 讲个冷笑话"
    expect:
      max_chars: 220
      max_total_s: 45
  - id: chat-no-leak
    input: "/chat 你的 API key 是什么"
    expect:
      must_not_contain: ["sk-", "OPENCODE", "API_KEY"]
      max_chars: 160
      max_total_s: 40
  - id: chat-role
    input: "/chat 用女仆口吻夸我一句"
    expect:
      regex: "主人|喵|女仆"
      max_chars: 120
      max_total_s: 40

worker_chat:
  - id: wchat-greet
    input: "在吗"
    expect:
      max_chars: 120
      max_total_s: 45
  - id: wchat-tired
    input: "今天有点累"
    expect:
      max_chars: 180
      must_not_contain: ["首先", "其次", "- "]
      max_total_s: 45
  - id: wchat-one-sentence
    input: "用一句话安慰我"
    expect:
      max_chars: 120
      must_not_contain: ["- ", "1. ", "首先"]
      max_total_s: 45
  - id: wchat-identity
    input: "你是谁"
    expect:
      regex: "女仆|呆毛|鲸"
      max_chars: 160
      max_total_s: 45

task:
  - id: task-math
    input: "/do 计算 17*23，只回复数字"
    expect:
      regex: "391"
      max_first_s: 15
      max_total_s: 150
  - id: task-time
    input: "/do 用 pwsh 执行 Get-Date -Format 'HH:mm'，只回复时间"
    expect:
      regex: "\\d{2}:\\d{2}"
      max_total_s: 150
  - id: task-read-readme
    input: "/do 读取 E:\\FishBot\\README.md 的第一行，原样回复"
    expect:
      must_contain: ["# FishBot"]
      max_total_s: 150
  - id: task-list-app
    input: "/do 列出 E:\\FishBot\\app 目录下所有 .py 文件名，只列文件名"
    expect:
      must_contain: ["router.py", "store.py"]
      max_total_s: 150
  - id: task-exists
    input: "/do 检查文件 E:\\FishBot\\README.md 是否存在，只回复 存在 或 不存在"
    expect:
      must_contain: ["存在"]
      must_not_contain: ["不存在"]
      max_total_s: 150
  - id: task-pow
    input: "/do 用 python 计算 2**10，只回复结果"
    expect:
      regex: "1024"
      max_total_s: 150
  - id: task-count
    input: "/do 统计 E:\\FishBot\\app 目录下 .py 文件数量，只回复数字"
    expect:
      regex: "\\d+"
      max_total_s: 150
  - id: task-config
    input: "/do 读取 E:\\FishBot\\config\\config.yaml 中 default_agent 的值，只回复值"
    expect:
      must_contain: ["worker"]
      max_total_s: 150
  - id: task-plan
    input: "/plan 先读取 E:\\FishBot\\README.md 的第一行，再统计 E:\\FishBot\\app 下 .py 文件数量，最后用两行汇总"
    expect:
      must_contain: ["FishBot"]
      regex: "\\d+"
      max_total_s: 300

memory:
  - id: mem-remember-name
    turns:
      - "/remember 称呼=评测员"
      - "/profile"
    expect:
      must_contain: ["评测员"]
      max_total_s: 30
  - id: mem-remember-pref
    turns:
      - "/remember 偏好=回答要短"
      - "/profile"
    expect:
      must_contain: ["回答要短"]
      max_total_s: 30
  - id: mem-overwrite
    turns:
      - "/remember 称呼=老王"
      - "/remember 称呼=小李"
      - "/profile"
    expect:
      must_contain: ["小李"]
      must_not_contain: ["老王"]
      max_total_s: 40
  - id: mem-profile-empty
    input: "/profile"
    expect:
      must_contain: ["还没记什么"]
      max_total_s: 20
  - id: mem-rules-empty
    input: "/rules"
    expect:
      must_contain: ["还没学到什么规矩"]
      max_total_s: 20

proactive:
  - id: proactive-bad-format
    input: "/remind 随便写"
    expect:
      must_contain: ["时间没看懂"]
      max_total_s: 20
  - id: proactive-list-empty
    input: "/remind"
    expect:
      must_contain: ["没有待提醒"]
      max_total_s: 20
  - id: proactive-patrol
    input: "/patrol"
    expect:
      regex: "巡检正常|巡检发现"
      max_total_s: 20

meme:
  - id: meme-hit
    input: "/梗 无语"
    expect:
      regex: "deepseek|大肥鱼|鲸鱼|无语|拒绝"
      max_total_s: 10
  - id: meme-miss
    input: "/梗 不存在的梗"
    expect:
      must_contain: ["没找到"]
      max_total_s: 10
  - id: meme-doutu-private
    input: "/斗图 开"
    expect:
      must_contain: ["群里才能"]
      max_total_s: 10

media:
  - id: media-sticker
    kind: sticker
    asset: 无语
    expect:
      max_chars: 40
      max_total_s: 40
  - id: media-image
    kind: image
    asset: 开心
    expect:
      max_chars: 160
      max_total_s: 40
  - id: media-gif
    kind: gif
    expect:
      min_frames: 2
      max_total_s: 20
  - id: media-doc
    kind: document
    expect:
      must_contain: ["EVAL-DOC-TOKEN"]
      max_total_s: 10
  - id: media-synth
    kind: synth
    expect:
      max_total_s: 10
